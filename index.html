<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sök efter anslutna akupunktörer på ort eller postnummer." />
    <title>Hitta akupunktör | Svenska Akupunkturförbundet</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <h1>Hitta våra akupunktörer</h1>
        <p class="intro">Sök efter en ansluten akupunktör med namn, ort eller postnummer. Träffarna visas direkt på kartan.</p>
      </header>

      <section class="finder" aria-label="Sök efter akupunktör">
        <aside class="search-panel">
          <form class="search-form" id="search-form" role="search">
            <label for="name-input">Namn</label>
            <input id="name-input" name="name" type="search" placeholder="Sök på akupunktör" autocomplete="name" />
            <label for="search-input">Ort eller postnummer</label>
            <input id="search-input" name="query" type="search" placeholder="Till exempel Uppsala eller 753 20" autocomplete="postal-code" />
            <button class="search-button" type="submit">Sök och visa på kartan</button>
            <button class="reset-button" id="reset-button" type="button" hidden>Visa alla akupunktörer</button>
          </form>

          <div class="result-heading">
            <h2>Sökresultat</h2>
            <p id="result-count" role="status" aria-live="polite"></p>
          </div>
          <div id="results" class="results"></div>
        </aside>

        <div class="map-panel">
          <div id="map" aria-label="Karta med akupunktörernas mottagningar"></div>
          <p class="map-help">Du kan zooma och flytta kartan. Välj en markör för mer information.</p>
        </div>
      </section>

      <p class="prototype-note"><strong>Prototyp:</strong> Alla namn och mottagningar på denna testsida är fiktiva.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
